services:
  postgres:
    image: postgres:16-alpine
    container_name: music-event-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music_event_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-music_event_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-music_event_user} -d ${POSTGRES_DB:-music_event_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: music-event-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${SERVER_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-music_event_user}:${POSTGRES_PASSWORD:-demo_password_change_me}@postgres:5432/${POSTGRES_DB:-music_event_db}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_min_32_chars_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_min_32_chars_long}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TIMEOUT_MS: ${ML_SERVICE_TIMEOUT_MS:-10000}
      ML_SERVICE_RETRY_COUNT: ${ML_SERVICE_RETRY_COUNT:-2}
    ports:
      - "${SERVER_PORT:-3001}:3001"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: music-event-ml
    restart: unless-stopped
    environment:
      ML_SERVICE_PORT: ${ML_SERVICE_PORT:-8000}
      ML_MODEL_VERSION: ${ML_MODEL_VERSION:-1.0.0}
      ML_MODEL_PATH: ${ML_MODEL_PATH:-./models/best_model.joblib}
      RANDOM_SEED: ${RANDOM_SEED:-42}
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./ml-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: music-event-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  postgres_data:
  server_node_modules:
